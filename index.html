 .row2{margin-top:10px}#title .small{opacity:.65;margin-top:22px;font-size:12px}#hud{pointer-events:none;opacity:0;transition:opacity .4s;position:fixed;inset:0}#hud.on{opacity:1}#meters{width:200px;padding:10px 12px;font-size:12px;position:absolute;top:14px;left:14px}.meter{margin:3px 0 7px}.meter .lbl{opacity:.85;justify-content:space-between;display:flex}.bar{background:#ffffff1f;border-radius:3px;height:6px;margin-top:3px;overflow:hidden}.bar i{border-radius:3px;height:100%;display:block}#m-town{background:linear-gradient(90deg,#f2702e,#ffd38a)}#m-sea{background:linear-gradient(90deg,#2d7fbf,#8fe3ff)}#m-hp{background:linear-gradient(90deg,#e2482a,#ffb04a)}#obj{text-align:right;max-width:340px;padding:10px 14px;position:absolute;top:14px;right:14px}#obj-text{font-size:15px;font-weight:700}#obj-sub{opacity:.78;margin-top:3px;font-size:12px}#powers{gap:6px;display:flex;position:absolute;bottom:14px;left:50%;transform:translate(-50%)}.pw{background:var(--glass);border:1px solid var(--line);opacity:.8;border-radius:10px;align-items:center;gap:8px;padding:6px 10px;font-size:11px;transition:all .12s;display:flex}.pw b{font-size:12px;display:block}.pw span{opacity:.7}.pw b,.pw span{word-break:keep-all}.pw-i{background:#ffb04a2e;border-radius:6px;place-items:center;width:20px;height:20px;font-weight:700;display:grid}.pw.on{opacity:1;border-color:var(--accent);transform:translateY(-3px);box-shadow:0 0 18px #ff963c73}#tut{opacity:0;pointer-events:auto;max-width:520px;padding:12px 16px;transition:all .3s;position:absolute;top:16px;left:50%;transform:translate(-50%,-12px)}#tut.on{opacity:1;transform:translate(-50%)}#tut-head{justify-content:space-between;align-items:center;gap:16px;display:flex}#tut-title{color:var(--accent);font-size:17px;font-weight:800}#tut-step{opacity:.7;font-size:11px}#tut-body{margin-top:5px;font-size:14px;line-height:1.4}#skip-tut{margin-top:8px;padding:4px 10px;font-size:11px}#toast{letter-spacing:.02em;text-shadow:0 2px 18px #00000080;opacity:0;white-space:nowrap;font-size:clamp(18px,2.4vw,30px);font-weight:800;position:absolute;top:38%;left:50%;transform:translate(-50%,-50%)}#toast.show{animation:2.6s ease-out toast}@keyframes toast{0%{opacity:0;transform:translate(-50%,-40%)scale(.96)}12%{opacity:1;transform:translate(-50%,-50%)scale(1)}80%{opacity:1}to{opacity:0;transform:translate(-50%,-56%)}}#cursor{pointer-events:none;z-index:5;width:0;height:0;display:none;position:fixed;top:0;left:0}#cursor:before,#cursor:after{content:"";background:#fff6ea;position:absolute;box-shadow:0 0 6px #ff963ce6}#cursor:before{width:22px;height:2px;top:-1px;left:-11px}#cursor:after{width:2px;height:22px;top:-11px;left:-1px}#cursor i{border:1px solid #ffb04a;border-radius:50%;width:6px;height:6px;position:absolute;top:-4px;left:-4px}#gripring{border:2px dashed #beaaffe6;border-radius:50%;display:none;position:absolute;top:0;left:0;box-shadow:0 0 14px #9678ff8c}#gripring.holding{border-style:solid;border-color:#c8b4fff2}body.playing canvas#view{cursor:none}.reticle{border:2px dashed #beaaffd9;border-radius:50%;display:none;position:absolute;transform:translate(-50%,-50%);box-shadow:inset 0 0 18px #9678ff80}#hint{opacity:.55;font-size:11px;position:absolute;bottom:14px;right:14px}.modal{pointer-events:auto;background:#10081473;place-items:center;display:none;position:fixed;inset:0}.modal.open{display:grid}.card{min-width:320px;max-width:620px;padding:20px 24px}.card h2{color:var(--accent);margin:0 0 12px;font-size:22px}#help-table{border-collapse:collapse;width:100%;font-size:13px}#help-table td{border-bottom:1px solid var(--line);padding:5px 10px}#help-table td:first-child{font-weight:700}#help-table td:last-child{opacity:.7}.card .row{flex-wrap:wrap;gap:10px;margin-top:14px;display:flex}.rr{border-bottom:1px solid var(--line);justify-content:space-between;gap:30px;padding:6px 0;font-size:15px;display:flex}.rr b{color:var(--accent)}label.vol{align-items:center;gap:10px;margin-top:12px;font-size:13px;display:flex}#style{align-items:center;gap:10px;min-width:150px;padding:8px 12px;display:none;position:fixed;top:96px;right:16px}#hud.on #style.on{display:flex}#style-rank{text-align:center;color:#ffd28a;text-shadow:0 2px 14px #ff8c2880;width:34px;font-size:38px;font-weight:900;line-height:1;transition:transform .15s}#style-rank.bump{transform:scale(1.3)}#style-rank.rS{color:#fff2c0}#style-rank.rA{color:#ffb04a}#style-rank.rB{color:#ff9a6a}#style-rank.rC{color:#d9b8ff}#style-rank.rD{color:#c8c0d0}#style-side{flex:1}#style-side .bar{height:5px}#style-bar{background:linear-gradient(90deg,#ff7a3a,#ffd28a)}#style-combo{margin-top:5px;font-size:13px;font-weight:800}#style-move{opacity:.75;min-height:14px;font-size:11px}#banner{text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;position:fixed;top:22%;left:50%;transform:translate(-50%,-8px)}#banner.show{opacity:1;transform:translate(-50%)}#banner b{letter-spacing:.06em;color:#ffe0a0;text-shadow:0 3px 20px #ff782899;font-size:clamp(26px,4vw,44px);font-weight:900;display:block}#banner span{opacity:.9;font-size:14px}#bossbar{text-align:center;width:min(520px,70vw);display:none;position:fixed;bottom:92px;left:50%;transform:translate(-50%)}#hud.on #bossbar.on{display:block}#boss-name{letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px 6px #0009;margin-bottom:4px;font-size:13px;font-weight:800}#bossbar .bar{height:4px}#boss-fill{background:linear-gradient(90deg,#ff5a2a,#ffc070);transition:width .3s}#boss-hint{opacity:.85;text-shadow:0 1px 6px #0009;margin-top:4px;font-size:12px}</style>

</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="loading">섬을 가열하는 중…</div>
<div id="hud">
	<div id="meters" class="panel">
		<div class="meter" id="meter-town"><div class="lbl"><span>마을 상태</span><span id="m-town-v">100%</span></div><div class="bar"><i id="m-town" style="width:100%"></i></div></div>
		<div class="meter" id="meter-sea"><div class="lbl"><span>해수면</span><span id="m-sea-v">100%</span></div><div class="bar"><i id="m-sea" style="width:100%"></i></div></div>
		<div class="meter"><div class="lbl"><span>주인공</span></div><div class="bar"><i id="m-hp" style="width:100%"></i></div></div>
	</div>
	<div id="obj" class="panel"><div id="obj-text">신더 타이드</div><div id="obj-sub"></div></div>
	<div id="tut" class="panel"><div id="tut-head"><span id="tut-title"></span><span id="tut-step"></span></div><div id="tut-body"></div><button id="skip-tut">튜토리얼 건너뛰기</button></div>
	<div id="toast"></div>
	<div id="banner"><b id="banner-name"></b><span id="banner-sub"></span></div>
	<div id="style" class="panel"><div id="style-rank">D</div><div id="style-side"><div class="bar"><i id="style-bar"></i></div><div id="style-combo"></div><div id="style-move"></div></div></div>
	<div id="bossbar"><div id="boss-name"></div><div class="bar"><i id="boss-fill"></i></div><div id="boss-hint"></div></div>
	<div id="reticle" class="reticle"></div>
	<div id="cursor"><i></i><div id="gripring"></div></div>
	<div id="powers"></div>
	<div id="hint">H 조작법 · Esc 메뉴</div>
</div>
<div id="title">
	<div class="box">
		<h1>CINDER<br>TIDE</h1>
		<p class="tag">바다를 끓이고, 산을 던지고, 마을을 지키세요 (대충이라도).</p>
		<div class="row"><button id="play-story" class="primary">플레이</button><button id="play-arena">아레나</button><button id="play-titan">보스: 마그마 타이탄</button><button id="play-leviathan">보스: 폭풍 리바이어던</button></div>
		<div class="row row2"><button id="play-sandbox">샌드박스</button><button id="title-controls">조작법</button></div>
		<div class="small">모든 픽셀이 시뮬레이션됩니다: 바위, 모래, 물, 용암, 증기, 구름, 얼음. 마우스 + 키보드 또는 게임패드.</div>
	</div>
</div>
<div id="help" class="modal"><div class="card panel"><h2>조작법</h2><table id="help-table"></table><div class="row"><button id="help-close" class="primary">확인</button></div></div></div>
<div id="pause" class="modal"><div class="card panel"><h2>일시정지</h2>
	<div class="row"><button id="pause-resume" class="primary">계속하기</button><button id="pause-controls">조작법</button><button id="pause-spawn">적 생성</button><button id="pause-restart">다시 시작</button></div>
	<label class="vol">볼륨 <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8"></label>
	<label class="vol">음악 <input id="music" type="range" min="0" max="0.4" step="0.01" value="0.11"></label></div></div>
<div id="report" class="modal"><div class="card panel"><h2 id="report-title">결과</h2><div id="report-rows"></div><div class="row"><button id="report-keep" class="primary">계속 플레이</button><button id="report-again">다시 하기</button></div></div></div>
<script src="patch-credits.js" defer></script>
</body>
</html>
